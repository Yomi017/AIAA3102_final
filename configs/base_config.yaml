# ALFworld Base Configuration
# 基于官方 ALFworld 标准配置

env:
  type: AlfredTWEnv  # 文本环境 (不需要 THOR)
  goal_desc_human_anns_prob: 0.0
  task_types: [1, 2, 3, 4, 5, 6]  # 所有6种任务类型
  domain_randomization: False  # 不使用域随机化
  expert_type: handcoded  # 专家类型: handcoded 或 planner
  
general:
  random_seed: 42
  save_path: ./logs/alfworld
  use_templated_goals: False
  training_method: dagger  # 训练方法: dagger 或 dqn
  
dataset:
  data_path: /data/home/sim6g/.cache/alfworld/json_2.1.1
  eval_id_data_path: /data/home/sim6g/.cache/alfworld/json_2.1.1/valid_seen
  eval_ood_data_path: /data/home/sim6g/.cache/alfworld/json_2.1.1/valid_unseen
  num_train_games: -1
  num_eval_games: -1
  
logic:
  domain: /data/home/sim6g/.cache/alfworld/logic/alfred.pddl
  grammar: /data/home/sim6g/.cache/alfworld/logic/alfred.twl2
  
controller:
  type: oracle
  
reward:
  dense: 0
  
mask_rcnn:
  pretrained_model: /data/home/sim6g/.cache/alfworld/detectors/mrcnn_alfred.pth

dagger:
  training:
    max_nb_steps_per_episode: 50  # 每个episode的最大步数
    
rl:
  training:
    max_nb_steps_per_episode: 50  # 每个episode的最大步数
